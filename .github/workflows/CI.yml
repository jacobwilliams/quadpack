name: CI
on: [push]
jobs:

  Build:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        gcc_v: [14] # Version of GFortran we want to use.
        python-version: [3.12]

    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        submodules: recursive

    - name: Install Python
      uses: actions/setup-python@v5.4.0 # Use pip to install latest CMake, & FORD/Jin2For, etc.
      with:
        python-version: ${{ matrix.python-version }}

    - name: Setup Graphviz
      uses: ts-graphviz/setup-graphviz@v1

    - name: Setup Fortran Package Manager
      uses: fortran-lang/setup-fpm@v7
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}

    - name: Setup Fortran compiler
      uses: fortran-lang/setup-fortran@v1.10.0
      with:
        compiler: gcc
        version: ${{ matrix.gcc_v }}

    - name: Install Python dependencies
      if: contains( matrix.os, 'ubuntu')
      run: |
        python -m pip install --upgrade pip
        pip install ford numpy matplotlib
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Install coverage tools
      if: contains( matrix.os, 'ubuntu')
      run: |
        sudo apt-get install lcov

    - name: Run tests
      run: fpm test --profile debug --flag "-coverage -I././src"

    - name: Create coverage report
      run: |
        mkdir -p "${COV_DIR}"
        find build -name '*.gcda' -o -name '*.gcno' | while read -r f; do
          cp "$f" "${COV_DIR}/"
        done
        lcov --capture --initial --base-directory . --directory "${COV_DIR}" --output-file "${COV_DIR}/coverage.base"
        lcov --capture           --base-directory . --directory "${COV_DIR}" --output-file "${COV_DIR}/coverage.capture"
        lcov --add-tracefile "${COV_DIR}/coverage.base" --add-tracefile "${COV_DIR}/coverage.capture" --output-file "${COV_DIR}/coverage.info"
      env:
        COV_DIR: build/coverage

    - name: Upload coverage report
      uses: codecov/codecov-action@v5
      with:
        files: build/coverage/coverage.info
        # token: ${{ secrets.CODECOV_TOKEN }}

    - name: Build documentation
      run: ford ./ford.md --externalize

    - name: Deploy Documentation
      if: github.ref == 'refs/heads/master'
      uses: JamesIves/github-pages-deploy-action@v4.7.3
      with:
        branch: gh-pages # The branch the action should deploy to.
        folder: doc  # The folder the action should deploy.
        single-commit: true
